<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lentot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    background: #ffffff;
    color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  .page {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* visually hidden heading — keeps "lentot" announced to screen readers */
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* pictogram stage — fills the rest of the screen */
  .stage {
    position: relative;
    width: 100%;
    flex: 1;
    overflow: hidden;
  }

  .figure {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 360px;
  }

  .ground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 36px;
    height: 1px;
    background: #000000;
    opacity: 0.12;
  }

  /*
    a soft shadow that walks the ground beneath each outfit, on the
    same path and timing as its set — pooling and fading exactly
    when the outfit comes into focus / blurs away under the head,
    so the floor doesn't sit empty while a set passes through
  */
  .shadow {
    position: absolute;
    left: 50%;
    bottom: 28px;
    width: 84px;
    height: 16px;
    margin-left: -42px;
    border-radius: 50%;
    background: #000000;
    filter: blur(3px);
    animation-name: shadow-walk;
    animation-duration: 9s;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-fill-mode: backwards;
  }

  .shadow--1 { animation-delay: 0s; }
  .shadow--2 { animation-delay: 3s; }
  .shadow--3 { animation-delay: 6s; }

  @keyframes shadow-walk {
    0% {
      transform: translateX(calc(-50vw - 140px)) scaleX(0.6);
      opacity: 0;
    }
    11.1111% {
      transform: translateX(0) scaleX(1);
      opacity: 0.16;
    }
    22.2222% {
      transform: translateX(0) scaleX(1.15);
      opacity: 0.22;
    }
    33.3333% {
      transform: translateX(calc(50vw + 140px)) scaleX(0.6);
      opacity: 0;
    }
    33.4% {
      transform: translateX(calc(-50vw - 140px)) scaleX(0.6);
      opacity: 0;
    }
    100% {
      transform: translateX(calc(-50vw - 140px)) scaleX(0.6);
      opacity: 0;
    }
  }

  .head {
    position: absolute;
    top: 0;
    left: 50%;
    width: 55px;
    height: 55px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: #000000;
    z-index: 2;
  }

  /*
    "lent" + the fixed head circle + "t" read together as "lentot" —
    the circle that anchors the walking pictogram doubles as the "o",
    so the wordmark is built outward from it rather than written as
    separate text
  */
  .logo-pre,
  .logo-post {
    position: absolute;
    top: 0;
    height: 55px;
    display: flex;
    align-items: center;
    font-size: 100px;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
    z-index: 2;
  }

  .logo-pre {
    right: calc(50% + 33.5px);
  }

  .logo-post {
    left: calc(50% + 33.5px);
  }

  .set {
    position: absolute;
    top: 56px;
    left: 50%;
    width: 130px;
    margin-left: -65px;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation-name: walk-across;
    animation-duration: 9s;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-fill-mode: backwards;
    will-change: transform, filter;
  }

  .set img {
    display: block;
    width: 100%;
    object-fit: contain;
  }

  .set .top {
    height: 160px;
  }

  .set .bottom {
    height: 66px;
    margin-top: -8px;
  }

  .set--1 { animation-delay: 0s; }
  .set--2 { animation-delay: 3s; }
  .set--3 { animation-delay: 6s; }

  /*
    enter blurred from off-screen left, sharpen into focus as it
    arrives under the head, hold there for 1s, then blur back out
    to the right — size never changes
  */
  @keyframes walk-across {
    0% {
      transform: translateX(calc(-50vw - 140px));
      filter: blur(16px);
    }
    11.1111% {
      transform: translateX(0);
      filter: blur(0);
    }
    22.2222% {
      transform: translateX(0);
      filter: blur(0);
    }
    33.3333% {
      transform: translateX(calc(50vw + 140px));
      filter: blur(16px);
    }
    33.4% {
      transform: translateX(calc(-50vw - 140px));
      filter: blur(16px);
    }
    100% {
      transform: translateX(calc(-50vw - 140px));
      filter: blur(16px);
    }
  }

  /* slogan */
  .tagline {
    margin-bottom: 28px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #000000;
    opacity: 0.45;
  }

  /* sign in button */
  .signin {
    appearance: none;
    border: 1px solid #000000;
    background: #000000;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 14px 56px;
    border-radius: 4px;
    cursor: pointer;
    margin-bottom: 64px;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .signin:hover {
    background: #ffffff;
    color: #000000;
  }

  .signin:active {
    transform: translateY(1px);
  }

  /*
    a stand-in circle, planted exactly over the logo's head dot when
    "Sign in" is pressed — it swells past the viewport edges to fade
    the screen to black, then the next page is loaded underneath it
  */
  .head-overlay {
    position: fixed;
    border-radius: 50%;
    background: #000000;
    transform: scale(1);
    transform-origin: center center;
    transition: transform 1.1s cubic-bezier(0.65, 0, 0.35, 1);
    z-index: 9999;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="page">
    <h1 class="visually-hidden">lentot</h1>

    <div class="stage" aria-hidden="true">
      <div class="figure">
        <span class="logo-pre" aria-hidden="true">lent</span>
        <span class="head" aria-hidden="true"></span>
        <span class="logo-post" aria-hidden="true">t</span>
        <span class="ground" aria-hidden="true"></span>
        <span class="shadow shadow--1" aria-hidden="true"></span>
        <span class="shadow shadow--2" aria-hidden="true"></span>
        <span class="shadow shadow--3" aria-hidden="true"></span>

        <div class="set set--1">
          <img class="top" src="lentot_last_style_girl_top_png/girl.1.png" alt="">
          <img class="bottom" src="lentot_last_style_girl_shoes_png/girl.1.png" alt="">
        </div>
        <div class="set set--2">
          <img class="top" src="lentot_last_style_girl_top_png/girl.2.png" alt="">
          <img class="bottom" src="lentot_last_style_girl_shoes_png/girl.2.png" alt="">
        </div>
        <div class="set set--3">
          <img class="top" src="lentot_last_style_girl_top_png/girl.3.png" alt="">
          <img class="bottom" src="lentot_last_style_girl_shoes_png/girl.3.png" alt="">
        </div>
      </div>
    </div>

    <p class="tagline">make your trip extraordinary</p>
    <button class="signin" type="button">Sign in</button>
  </div>

  <script>
    (function () {
      var signinBtn = document.querySelector('.signin');
      var head = document.querySelector('.head');

      signinBtn.addEventListener('click', function () {
        if (document.querySelector('.head-overlay')) return;

        var rect = head.getBoundingClientRect();
        var overlay = document.createElement('div');
        overlay.className = 'head-overlay';
        overlay.style.width = rect.width + 'px';
        overlay.style.height = rect.height + 'px';
        overlay.style.left = rect.left + 'px';
        overlay.style.top = rect.top + 'px';
        document.body.appendChild(overlay);

        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        var corners = [
          [0, 0],
          [window.innerWidth, 0],
          [0, window.innerHeight],
          [window.innerWidth, window.innerHeight]
        ];
        var maxDist = 0;
        corners.forEach(function (corner) {
          var d = Math.hypot(corner[0] - cx, corner[1] - cy);
          if (d > maxDist) maxDist = d;
        });
        var scale = (maxDist / (rect.width / 2)) * 1.2;

        overlay.getBoundingClientRect();
        overlay.style.transform = 'scale(' + scale + ')';

        overlay.addEventListener('transitionend', function () {
          sessionStorage.setItem('lentot-transition', 'in');
          window.location.href = 'lentot.main.html';
        }, { once: true });
      });
    })();
  </script>
</body>
</html>
