<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lentot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    background: #ffffff;
    color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  .page {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* visually hidden heading — keeps "lentot" announced to screen readers */
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* pictogram stage — fills the rest of the screen */
  .stage {
    position: relative;
    width: 100%;
    flex: 1;
    overflow: hidden;
  }

  .figure {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 360px;
  }

  .ground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 36px;
    height: 1px;
    background: #000000;
    opacity: 0.12;
  }

  /*
    a soft shadow that pools beneath the outfit while it pauses under
    the head — faded in by script for the hold, then faded back out
    once that outfit sets off toward its day box
  */
  .shadow {
    position: absolute;
    left: 50%;
    bottom: 28px;
    width: 84px;
    height: 16px;
    margin-left: -42px;
    border-radius: 50%;
    background: #000000;
    filter: blur(3px);
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .shadow.is-visible {
    opacity: 0.18;
  }

  .head {
    position: absolute;
    top: 0;
    left: 50%;
    width: 55px;
    height: 55px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: #000000;
    z-index: 2;
  }

  /*
    "lent" + the fixed head circle + "t" read together as "lentot" —
    the circle that anchors the walking pictogram doubles as the "o",
    so the wordmark is built outward from it rather than written as
    separate text
  */
  .logo-pre,
  .logo-post {
    position: absolute;
    top: 0;
    height: 55px;
    display: flex;
    align-items: center;
    font-size: 100px;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
    z-index: 2;
  }

  .logo-pre {
    right: calc(50% + 33.5px);
  }

  .logo-post {
    left: calc(50% + 33.5px);
  }

  .set {
    position: absolute;
    top: 56px;
    left: 50%;
    width: 130px;
    margin-left: -65px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translate(calc(-50vw - 140px), 0) scale(1);
    filter: blur(16px);
    opacity: 0;
    will-change: transform, filter, opacity;
  }

  .set img {
    display: block;
    width: 100%;
    object-fit: contain;
  }

  .set .top {
    height: 160px;
  }

  .set .bottom {
    height: 66px;
    margin-top: -8px;
  }

  /*
    DAY1–DAY3 boxes — pinned to the right edge of the stage. Each
    outfit, once its turn under the head is over, travels here and
    settles into its own box in order; once all three are filled the
    whole set blurs away together and the cycle starts again
  */
  .day-list {
    position: absolute;
    top: 50%;
    right: clamp(16px, 6vw, 64px);
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .day-box {
    width: 96px;
    padding: 14px 10px;
    border: 1px solid rgba(0, 0, 0, 0.16);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: #ffffff;
  }

  .day-box__label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: #000000;
    opacity: 0.4;
  }

  .day-box__slot {
    display: block;
    width: 62px;
    height: 104px;
  }

  /* slogan */
  .tagline {
    margin-bottom: 28px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #000000;
    opacity: 0.45;
  }

  /* sign in button */
  .signin {
    appearance: none;
    border: 1px solid #000000;
    background: #000000;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 14px 56px;
    border-radius: 4px;
    cursor: pointer;
    margin-bottom: 64px;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .signin:hover {
    background: #ffffff;
    color: #000000;
  }

  .signin:active {
    transform: translateY(1px);
  }

  /*
    a stand-in circle, planted exactly over the logo's head dot when
    "Sign in" is pressed — it swells past the viewport edges to fade
    the screen to black, then the next page is loaded underneath it
  */
  .head-overlay {
    position: fixed;
    border-radius: 50%;
    background: #000000;
    transform: scale(1);
    transform-origin: center center;
    transition: transform 1.1s cubic-bezier(0.65, 0, 0.35, 1);
    z-index: 9999;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="page">
    <h1 class="visually-hidden">lentot</h1>

    <div class="stage" aria-hidden="true">
      <div class="day-list">
        <div class="day-box">
          <span class="day-box__label">DAY1</span>
          <span class="day-box__slot"></span>
        </div>
        <div class="day-box">
          <span class="day-box__label">DAY2</span>
          <span class="day-box__slot"></span>
        </div>
        <div class="day-box">
          <span class="day-box__label">DAY3</span>
          <span class="day-box__slot"></span>
        </div>
      </div>

      <div class="figure">
        <span class="logo-pre" aria-hidden="true">lent</span>
        <span class="head" aria-hidden="true"></span>
        <span class="logo-post" aria-hidden="true">t</span>
        <span class="ground" aria-hidden="true"></span>
        <span class="shadow" aria-hidden="true"></span>

        <div class="set set--1">
          <img class="top" src="lentot_last_style_girl_top_png/girl.1.png" alt="">
          <img class="bottom" src="lentot_last_style_girl_shoes_png/girl.1.png" alt="">
        </div>
        <div class="set set--2">
          <img class="top" src="lentot_last_style_girl_top_png/girl.2.png" alt="">
          <img class="bottom" src="lentot_last_style_girl_shoes_png/girl.2.png" alt="">
        </div>
        <div class="set set--3">
          <img class="top" src="lentot_last_style_girl_top_png/girl.3.png" alt="">
          <img class="bottom" src="lentot_last_style_girl_shoes_png/girl.3.png" alt="">
        </div>
      </div>
    </div>

    <p class="tagline">make your trip extraordinary</p>
    <button class="signin" type="button">Sign in</button>
  </div>

  <script>
    /*
      Walking sequence: each outfit blurs in from the left, sharpens
      to focus and pauses under the head (shadow pools beneath it),
      then travels over to its own DAY box and settles inside, in
      order. Once all three boxes are filled, every outfit blurs and
      fades out together, resets off-screen, and the cycle repeats.
    */
    (function () {
      var sets = Array.prototype.slice.call(document.querySelectorAll('.set'));
      var slots = Array.prototype.slice.call(document.querySelectorAll('.day-box__slot'));
      var shadow = document.querySelector('.shadow');

      var OFFSCREEN = 'translate(calc(-50vw - 140px), 0) scale(1)';
      var AT_HEAD = 'translate(0, 0) scale(1)';

      function wait(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
      }

      function nextFrame() {
        return new Promise(function (resolve) {
          requestAnimationFrame(function () { requestAnimationFrame(resolve); });
        });
      }

      function placeNow(el, transform, filter, opacity) {
        el.style.transition = 'none';
        el.style.transform = transform;
        el.style.filter = filter;
        el.style.opacity = opacity;
        el.getBoundingClientRect();
        el.style.transition = '';
      }

      function moveTo(el, transform, filter, opacity, duration, easing) {
        return new Promise(function (resolve) {
          el.style.transition =
            'transform ' + duration + 'ms ' + easing + ', ' +
            'filter ' + duration + 'ms ' + easing + ', ' +
            'opacity ' + duration + 'ms ' + easing;
          el.getBoundingClientRect();
          el.style.transform = transform;
          el.style.filter = filter;
          el.style.opacity = opacity;
          setTimeout(resolve, duration);
        });
      }

      function fadeOut(el, duration) {
        return new Promise(function (resolve) {
          el.style.transition = 'filter ' + duration + 'ms ease, opacity ' + duration + 'ms ease';
          el.getBoundingClientRect();
          el.style.filter = 'blur(16px)';
          el.style.opacity = '0';
          setTimeout(resolve, duration);
        });
      }

      function travelToSlot(el, slot) {
        var setRect = el.getBoundingClientRect();
        var slotRect = slot.getBoundingClientRect();
        var dx = (slotRect.left + slotRect.width / 2) - (setRect.left + setRect.width / 2);
        var dy = (slotRect.top + slotRect.height / 2) - (setRect.top + setRect.height / 2);
        var scale = Math.min(slotRect.width / setRect.width, slotRect.height / setRect.height);
        return moveTo(
          el,
          'translate(' + dx + 'px, ' + dy + 'px) scale(' + scale + ')',
          'blur(0)',
          '1',
          1100,
          'cubic-bezier(0.65, 0, 0.35, 1)'
        );
      }

      async function runCycle() {
        for (var i = 0; i < sets.length; i++) {
          var el = sets[i];
          placeNow(el, OFFSCREEN, 'blur(16px)', '0');
          await nextFrame();
          await moveTo(el, AT_HEAD, 'blur(0)', '1', 1500, 'linear');
          shadow.classList.add('is-visible');
          await wait(900);
          shadow.classList.remove('is-visible');
          await travelToSlot(el, slots[i]);
        }

        await wait(900);
        await Promise.all(sets.map(function (el) { return fadeOut(el, 900); }));
        sets.forEach(function (el) { placeNow(el, OFFSCREEN, 'blur(16px)', '0'); });

        await wait(400);
        runCycle();
      }

      runCycle();
    })();

    (function () {
      var signinBtn = document.querySelector('.signin');
      var head = document.querySelector('.head');

      signinBtn.addEventListener('click', function () {
        if (document.querySelector('.head-overlay')) return;

        var rect = head.getBoundingClientRect();
        var overlay = document.createElement('div');
        overlay.className = 'head-overlay';
        overlay.style.width = rect.width + 'px';
        overlay.style.height = rect.height + 'px';
        overlay.style.left = rect.left + 'px';
        overlay.style.top = rect.top + 'px';
        document.body.appendChild(overlay);

        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        var corners = [
          [0, 0],
          [window.innerWidth, 0],
          [0, window.innerHeight],
          [window.innerWidth, window.innerHeight]
        ];
        var maxDist = 0;
        corners.forEach(function (corner) {
          var d = Math.hypot(corner[0] - cx, corner[1] - cy);
          if (d > maxDist) maxDist = d;
        });
        var scale = (maxDist / (rect.width / 2)) * 1.2;

        overlay.getBoundingClientRect();
        overlay.style.transform = 'scale(' + scale + ')';

        overlay.addEventListener('transitionend', function () {
          sessionStorage.setItem('lentot-transition', 'in');
          window.location.href = 'lentot.main.html';
        }, { once: true });
      });
    })();
  </script>
</body>
</html>
